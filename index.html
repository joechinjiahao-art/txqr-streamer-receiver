<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Stream Receiver</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #222; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #333; padding: 20px; border-radius: 8px; max-width: 500px; width: 100%; text-align: center; }
        #reader { width: 100%; min-height: 300px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .progress-box { background: #444; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        #missing-frames { color: #ffeb3b; font-size: 14px; margin-top: 10px; word-wrap: break-word; }
        button { background-color: #28a745; color: white; border: none; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; display: none; }
        button:hover { background-color: #218838; }
        h2, p { margin: 10px 0; }
    </style>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

<div class="container">
    <h2>Stream Receiver</h2>
    <p>Point camera at the QR stream.</p>
    
    <div id="reader"></div>

    <div class="progress-box">
        <h3 id="progress-text">Waiting for first frame...</h3>
        <div id="missing-frames">Missing: ?</div>
    </div>

    <button id="btnDownload" onclick="downloadData()">Download Complete File</button>
</div>

<script>
    let receivedData = [];
    let totalFrames = 0;
    let framesCollected = 0;
    let isComplete = false;

    // Regular expression to match "[Current/Total]Payload"
    const headerRegex = /^\[(\d+)\/(\d+)\]([\s\S]*)$/;

    function onScanSuccess(decodedText) {
        if (isComplete) return;

        const match = decodedText.match(headerRegex);
        if (!match) return; // Not a part of our stream

        const currentFrame = parseInt(match[1], 10);
        const total = parseInt(match[2], 10);
        const payload = match[3];

        // Initialize array on first valid scan
        if (totalFrames === 0) {
            totalFrames = total;
            receivedData = new Array(total).fill(null);
        }

        // Only save if we haven't seen this frame yet
        if (receivedData[currentFrame - 1] === null) {
            receivedData[currentFrame - 1] = payload;
            framesCollected++;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('progress-text').innerText = `Collected ${framesCollected} / ${totalFrames} Frames`;

        // Calculate missing frames
        let missing = [];
        for (let i = 0; i < totalFrames; i++) {
            if (receivedData[i] === null) missing.push(i + 1);
        }

        if (missing.length > 0) {
            // Show up to 10 missing frames to avoid huge text blocks
            let displayMissing = missing.slice(0, 10).join(", ");
            if (missing.length > 10) displayMissing += "...";
            document.getElementById('missing-frames').innerText = `Looking for: ${displayMissing}`;
        } else {
            // Stream is fully collected!
            isComplete = true;
            document.getElementById('missing-frames').innerText = "All frames collected successfully!";
            document.getElementById('missing-frames').style.color = "#4caf50";
            document.getElementById('btnDownload').style.display = "block";
            
            // Optional: Stop the scanner to save battery
            html5QrcodeScanner.clear();
        }
    }

    function downloadData() {
        // Stitch the chunks together
        const completeString = receivedData.join("");
        
        // Create a blob and trigger download
        const blob = new Blob([completeString], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'QR_Stream_Received.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function onScanFailure(error) {
        // Scanner constantly throws soft errors when no QR is in frame. Ignore them.
    }

    // Start the webcam scanner
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 15, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

</script>
</body>
</html>
