<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXQR RECEIVER V22.0</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; text-align: center; padding: 20px; }
        .box { border: 2px solid #00ff41; display: inline-block; padding: 25px; background: #050505; border-radius: 12px; width: 90%; max-width: 500px; }
        #video-preview { width: 100%; border: 2px solid #333; transform: scaleX(-1); margin-bottom: 15px; }
        .progress-container { background: #222; height: 30px; border-radius: 15px; overflow: hidden; margin: 15px 0; border: 1px solid #00ff41; }
        #progress-bar { width: 0%; height: 100%; background: #00ff41; transition: width 0.2s; }
        #save-btn { padding: 20px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; display: none; background: #00ff41; color: #000; border: none; }
        .stats { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h3>TXQR RECEIVER V22.0</h3>
    <video id="video-preview" autoplay playsinline></video>
    
    <div class="stats">
        <span>COLLECTED: <b id="count">0</b> / <b id="total">?</b></span>
        <span>PROGRESS: <b id="percent">0%</b></span>
    </div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <button id="save-btn" onclick="downloadAssembly()">💾 SAVE ASSEMBLED FILE</button>
    <p id="status">INITIALIZING CAMERA...</p>
</div>

<!-- ZXING SCANNER ENGINE -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const collectedChunks = new Map();
    let totalExpected = 0;

    // Start Camera
    codeReader.decodeFromVideoDevice(null, 'video-preview', (result, err) => {
        if (result) {
            processFrame(result.text);
        }
    });

    function processFrame(content) {
        // Format expected: "1/500|base64data"
        const parts = content.split('|');
        if (parts.length < 2) return;

        const meta = parts[0].split('/');
        const currentIdx = parseInt(meta[0]);
        const totalIdx = parseInt(meta[1]);
        const data = parts[1];

        if (!totalExpected) totalExpected = totalIdx;
        document.getElementById('total').innerText = totalExpected;

        if (!collectedChunks.has(currentIdx)) {
            collectedChunks.set(currentIdx, data);
            updateUI();
        }
    }

    function updateUI() {
        const count = collectedChunks.size;
        const progress = (count / totalExpected) * 100;
        
        document.getElementById('count').innerText = count;
        document.getElementById('progress-bar').style.width = progress + "%";
        document.getElementById('percent').innerText = Math.round(progress) + "%";

        if (count === totalExpected && totalExpected > 0) {
            document.getElementById('status').innerText = "TRANSFER COMPLETE!";
            document.getElementById('save-btn').style.display = "block";
        } else {
            document.getElementById('status').innerText = "SCANNING STREAM...";
        }
    }

    function downloadAssembly() {
        document.getElementById('status').innerText = "ASSEMBLING BINARY... PLEASE WAIT.";
        
        // Sort chunks in order
        let fullBase64 = "";
        for (let i = 1; i <= totalExpected; i++) {
            fullBase64 += collectedChunks.get(i);
        }

        // Convert Base64 to Blob
        const byteCharacters = atob(fullBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], {type: "application/octet-stream"});

        // Trigger Download
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "received_file_" + Date.now() + ".bin";
        document.body.appendChild(a);
        a.click();
        
        // Cleanup
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            document.getElementById('status').innerText = "FILE SAVED.";
        }, 100);
    }
</script>
</body>
</html>
