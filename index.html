<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXQR RECEIVER V23.1 - OPTIMIZED</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .container { border: 2px solid #00ff41; display: inline-block; padding: 25px; background: #050505; border-radius: 12px; width: 90%; max-width: 600px; box-shadow: 0 0 20px rgba(0,255,65,0.3); }
        #video-preview { width: 100%; border: 2px solid #333; background: #111; margin-bottom: 15px; border-radius: 4px; transition: border 0.1s; }
        .ui-panel { background: #111; padding: 15px; border: 1px solid #333; margin: 10px 0; }
        .progress-box { background: #222; height: 25px; border: 1px solid #00ff41; margin: 10px 0; position: relative; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: #00ff41; transition: width 0.3s; }
        button { padding: 12px 20px; margin: 5px; cursor: pointer; font-weight: bold; border: none; text-transform: uppercase; border-radius: 4px; }
        .btn-cam { background: #0088ff; color: #fff; }
        .btn-stop { background: #ff4444; color: #fff; }
        .btn-download { background: #00ff41; color: #000; display: none; width: 100%; font-size: 1.2em; margin-top: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; margin-bottom: 10px; text-align: left; }
        .missing-tag { color: #ffbc00; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>TXQR RECEIVER V23.1</h2>
    
    <video id="video-preview" autoplay playsinline></video>

    <div class="ui-panel">
        <button class="btn-cam" onclick="initCamera()">📷 START OPTIMIZED SCAN</button>
        <button class="btn-stop" onclick="killCamera()">🛑 STOP CAMERA</button>
    </div>

    <div class="info-grid">
        <div>COLLECTED: <b id="count">0</b> / <b id="total">?</b></div>
        <div>STATUS: <b id="status">IDLE</b></div>
        <div>PROGRESS: <b id="percent">0%</b></div>
        <div>NEXT MISSING: <span id="next-missing" class="missing-tag">NONE</span></div>
    </div>

    <div class="progress-box"><div id="bar"></div></div>

    <button id="download-btn" class="btn-download" onclick="reconstructAndSave()">💾 DOWNLOAD ASSEMBLED FILE</button>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<script>
    // CRITICAL: Configure Decode Hints for High-Density QR Codes
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // Deep-scan binarization
    hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'UTF-8');

    let codeReader = new ZXing.BrowserMultiFormatReader(hints);
    let collectedChunks = new Map();
    let totalFrames = 0;
    let isScanning = false;

    async function initCamera() {
        const videoElem = document.getElementById('video-preview');
        try {
            isScanning = true;
            document.getElementById('status').innerText = "CALIBRATING...";
            
            // Request High Resolution to capture small QR modules clearly
            const constraints = {
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            // Use decodeFromConstraints for better control over the video stream
            codeReader.decodeFromConstraints(constraints, videoElem, (result, err) => {
                if (result && isScanning) {
                    // Success Flash
                    videoElem.style.borderColor = "#00ff41";
                    setTimeout(() => videoElem.style.borderColor = "#333", 100);
                    
                    handlePacket(result.text);
                }
                if (err && !(err instanceof ZXing.NotFoundException)) {
                    console.error("Reader Error:", err);
                }
            });
            
            document.getElementById('status').innerText = "SCANNING...";
        } catch (e) {
            alert("Camera access denied: " + e);
            document.getElementById('status').innerText = "ERROR";
        }
    }

    function killCamera() {
        isScanning = false;
        codeReader.reset();
        document.getElementById('status').innerText = "CAMERA OFF";
    }

    function handlePacket(raw) {
        // Expected Protocol: "1/500|base64content..."
        if (!raw.includes('|') || !raw.includes('/')) return;

        const parts = raw.split('|');
        const meta = parts[0].split('/');
        const current = parseInt(meta[0]);
        const total = parseInt(meta[1]);
        const content = parts[1];

        if (isNaN(current) || isNaN(total)) return;

        if (!totalFrames) totalFrames = total;

        if (!collectedChunks.has(current)) {
            collectedChunks.set(current, content);
            refreshUI();
        }
    }

    function refreshUI() {
        const count = collectedChunks.size;
        const progress = totalFrames > 0 ? (count / totalFrames) * 100 : 0;
        
        document.getElementById('count').innerText = count;
        document.getElementById('total').innerText = totalFrames || "?";
        document.getElementById('percent').innerText = Math.round(progress) + "%";
        document.getElementById('bar').style.width = progress + "%";

        let nextMissing = "NONE";
        for (let i = 1; i <= totalFrames; i++) {
            if (!collectedChunks.has(i)) {
                nextMissing = i;
                break;
            }
        }
        document.getElementById('next-missing').innerText = nextMissing;

        if (count === totalFrames && totalFrames > 0) {
            document.getElementById('status').innerText = "COMPLETE!";
            document.getElementById('download-btn').style.display = "block";
            killCamera();
        }
    }

    function reconstructAndSave() {
        document.getElementById('status').innerText = "ASSEMBLING...";
        try {
            let fullBase64 = "";
            for (let i = 1; i <= totalFrames; i++) {
                fullBase64 += collectedChunks.get(i);
            }

            const binaryString = atob(fullBase64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const blob = new Blob([bytes], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "txqr_file_" + new Date().getTime() + ".bin";
            a.click();
            document.getElementById('status').innerText = "SAVED!";
        } catch (e) {
            alert("Reconstruction failed. Invalid Base64 data.");
            console.error(e);
        }
    }
</script>
</body>
</html>
