<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXQR RECEIVER V6 - STABLE</title>
    <!-- You MUST have jsQR.js in the same folder for this to work offline -->
    <script src="jsQR.js"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; text-align: center; }
        #preview { border: 2px solid #00ff41; width: 100%; max-width: 500px; }
        .stats { background: #111; padding: 15px; margin: 10px auto; width: 470px; border: 1px solid #333; text-align: left; }
        .missing { color: #ff4444; border-top: 1px solid #333; margin-top: 10px; padding-top: 10px; word-wrap: break-word; }
        .success { color: #00ff41; font-weight: bold; }
    </style>
</head>
<body>
    <h2>TXQR RECEIVER V6</h2>
    <canvas id="canvas" hidden></canvas>
    <video id="video" autoplay playsinline></video>
    
    <div class="stats">
        <div>PROGRESS: <span id="count">0</span> / <span id="total">?</span></div>
        <div id="missing-list" class="missing">MISSING: Waiting for first frame...</div>
    </div>

    <textarea id="result" style="width:500px; height:100px;" readonly></textarea>

<script>
    const video = document.getElementById("video");
    const canvasElement = document.getElementById("canvas");
    const canvas = canvasElement.getContext("2d");
    const chunks = new Map();
    let totalFrames = 0;

    // Start Camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then((stream) => {
        video.srcObject = stream;
        video.setAttribute("playsinline", true); 
        video.play();
        requestAnimationFrame(tick);
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.hidden = false;
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            // This line requires jsQR.js to be in the folder
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                processData(code.data);
            }
        }
        requestAnimationFrame(tick);
    }

    function processData(data) {
        const parts = data.match(/^(\d+)\/(\d+)\|(.*)/s);
        if (!parts) return;

        const currentIdx = parseInt(parts[1]);
        const totalIdx = parseInt(parts[2]);
        const payload = parts[3];

        if (totalFrames === 0) totalFrames = totalIdx;
        document.getElementById("total").innerText = totalFrames;

        if (!chunks.has(currentIdx)) {
            chunks.set(currentIdx, payload);
            updateMissing();
        }
    }

    function updateMissing() {
        document.getElementById("count").innerText = chunks.size;
        let missing = [];
        for (let i = 1; i <= totalFrames; i++) {
            if (!chunks.has(i)) missing.push(i);
        }

        if (missing.length === 0) {
            document.getElementById("missing-list").innerHTML = "<span class='success'>TRANSFER COMPLETE</span>";
            assemble();
        } else {
            document.getElementById("missing-list").innerText = "MISSING: " + missing.join(", ");
        }
    }

    function assemble() {
        let full = "";
        for (let i = 1; i <= totalFrames; i++) {
            full += chunks.get(i);
        }
        document.getElementById("result").value = full;
    }
</script>
</body>
</html>
