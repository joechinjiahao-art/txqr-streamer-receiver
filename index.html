<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXQR RECEIVER - GAP ANALYZER</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; margin: 0; padding: 20px; text-align: center; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        video { border: 2px solid #333; width: 100%; max-width: 500px; background: #111; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 500px; text-align: left; }
        .stat-box { background: #111; padding: 10px; border: 1px solid #00ff41; }
        .missing-box { 
            background: #1a0000; color: #ff4444; border: 1px solid #ff4444; 
            padding: 10px; width: 500px; height: 80px; overflow-y: auto; text-align: left; word-break: break-all;
        }
        progress { width: 100%; height: 20px; }
        textarea { width: 500px; height: 100px; background: #222; color: #fff; margin-top: 10px; }
        .btn { padding: 10px 20px; background: #00ff41; color: #000; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>TXQR RECEIVER V5</h2>
    
    <video id="video" autoplay playsinline></video>
    
    <div class="dashboard">
        <div class="stat-box">PROGRESS: <span id="progText">0/0</span></div>
        <div class="stat-box">STATUS: <span id="status">IDLE</span></div>
    </div>

    <progress id="progBar" value="0" max="100"></progress>

    <div class="missing-box">
        <strong>MISSING FRAMES:</strong><br>
        <span id="missingList">Waiting for data...</span>
    </div>

    <button class="btn" onclick="startCamera()">Start Camera</button>
    <textarea id="output" placeholder="Reconstructed data will appear here..."></textarea>
</div>

<script>
let receivedChunks = new Map();
let totalChunks = 0;
let isProcessing = false;

async function startCamera() {
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        document.getElementById('status').innerText = "SCANNING...";
        scan();
    } catch (err) {
        alert("Camera error: " + err);
    }
}

async function scan() {
    const video = document.getElementById('video');
    const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

    setInterval(async () => {
        try {
            const barcodes = await barcodeDetector.detect(video);
            if (barcodes.length > 0) {
                processData(barcodes[0].rawValue);
            }
        } catch (e) {
            // Some browsers require polyfills or specific flags for BarcodeDetector
        }
    }, 100); // Scan every 100ms
}

function processData(val) {
    // Format: "index/total|data"
    const match = val.match(/^(\d+)\/(\d+)\|(.*)/s);
    if (!match) return;

    const idx = parseInt(match[1]);
    const total = parseInt(match[2]);
    const content = match[3];

    if (totalChunks === 0) totalChunks = total;
    
    if (!receivedChunks.has(idx)) {
        receivedChunks.set(idx, content);
        updateUI();
    }
}

function updateUI() {
    const count = receivedChunks.size;
    document.getElementById('progText').innerText = `${count} / ${totalChunks}`;
    document.getElementById('progBar').max = totalChunks;
    document.getElementById('progBar').value = count;

    // Calculate Missing
    let missing = [];
    for (let i = 1; i <= totalChunks; i++) {
        if (!receivedChunks.has(i)) {
            missing.push(i);
        }
    }

    if (missing.length === 0 && totalChunks > 0) {
        document.getElementById('status').innerText = "COMPLETE!";
        document.getElementById('missingList').innerText = "None - All parts received.";
        assembleData();
    } else {
        // Show missing as ranges to save space (e.g., 5-10, 15, 20-25)
        document.getElementById('missingList').innerText = missing.join(', ');
    }
}

function assembleData() {
    let finalStr = "";
    for (let i = 1; i <= totalChunks; i++) {
        finalStr += receivedChunks.get(i);
    }
    document.getElementById('output').value = finalStr;
}
</script>
</body>
</html>
