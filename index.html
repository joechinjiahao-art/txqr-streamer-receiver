<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXQR V8.2 - PERMISSION FIX</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; text-align: center; }
        .box { border: 2px solid #00ff41; display: inline-block; padding: 20px; background: #050505; width: 90%; max-width: 600px; border-radius: 8px; }
        #video-preview { width: 100%; border: 1px solid #333; background: #111; margin-top: 15px; border-radius: 4px; }
        .btn-start { background: #00ff41; color: #000; padding: 20px; font-weight: bold; border: none; cursor: pointer; width: 100%; font-size: 16px; border-radius: 4px; }
        .hint { color: #888; font-size: 11px; margin-top: 10px; }
        #status-msg { margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>TXQR RECEIVER V8.2</h2>
    <div id="status-msg">READY</div>

    <div id="setup-view">
        <button class="btn-start" onclick="initCamera()">GRANT CAMERA ACCESS</button>
        <p class="hint">If clicking doesn't work, click the 🔒 icon in the URL bar and reset permissions.</p>
    </div>

    <video id="video-preview" autoplay playsinline hidden></video>
    <canvas id="hidden-canvas" hidden></canvas>
    
    <div style="text-align: left; background: #111; padding: 15px; margin-top: 10px; border: 1px solid #222;">
        PROGRESS: <b id="count">0</b> / <b id="total">?</b>
        <progress id="pBar" value="0" max="100" style="width:100%; accent-color:#00ff41;"></progress>
    </div>
</div>

<script>
    async function initCamera() {
        const msg = document.getElementById("status-msg");
        msg.innerText = "REQUESTING ACCESS...";
        msg.style.color = "#ffff00";

        const constraints = {
            video: {
                facingMode: "environment", // Specifically ask for back camera
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const video = document.getElementById("video-preview");
            video.srcObject = stream;
            video.hidden = false;
            document.getElementById("setup-view").hidden = true;
            msg.innerText = "CAMERA ACTIVE";
            msg.style.color = "#00ff41";
            
            // Start the scanning loop
            requestAnimationFrame(tick);
        } catch (err) {
            console.error(err);
            msg.innerText = "ACCESS DENIED";
            msg.style.color = "#ff4444";
            alert("Error: " + err.name + "\nCheck if another app is using the camera or if permissions are blocked in OS settings.");
        }
    }

    // ... (rest of the scan logic remains the same as V8.1)
    function tick() {
        const video = document.getElementById("video-preview");
        const canvasElement = document.getElementById("hidden-canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) { /* process data as before */ }
        }
        requestAnimationFrame(tick);
    }
</script>
</body>
</html>
